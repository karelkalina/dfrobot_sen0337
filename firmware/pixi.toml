[workspace]
authors = ["Jakub Marsik <jmarsik@fullvent.cz>"]
channels = ["conda-forge"]
name = "AtomLite-DFRobot-DistanceSensor"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
compile = "esphome compile atomlite-distance.yaml"
upload = "esphome upload atomlite-distance.yaml"
run = "esphome run atomlite-distance.yaml"
logs = "esphome logs atomlite-distance.yaml"
clean = "esphome clean atomlite-distance.yaml"

[dependencies]
python = "3.13.*"
pip = ">=26.0.1,<27"

[pypi-dependencies]
esphome = "==2025.12.7"
