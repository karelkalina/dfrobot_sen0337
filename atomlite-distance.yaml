substitutions:
  devicename: atomlite-distance

esphome:
  name: $devicename
  name_add_mac_suffix: true
  platformio_options:
    build_flags:
      - -D CORE_DEBUG_LEVEL=0
      - -D ARDUINO_LOG_LEVEL=0

esp32:
  board: m5stack-atom
  framework:
    type: arduino
    version: latest

external_components:
  - source: components

uart:
  id: uart_sensor
  tx_pin: GPIO26
  rx_pin: GPIO32
  baud_rate: 115200

dfrobot_sen0337:
  uart_id: uart_sensor

sensor:
  - platform: dfrobot_sen0337
    distance:
      name: Distance
      id: distance
      internal: true
    signal_strength:
      name: Signal Strength
      id: signal_strength
      internal: true

text_sensor:
  - platform: template
    name: Paired Sensor Data
    id: data      
    update_interval: 500ms
    lambda: |-
      if (id(distance).has_state() && id(signal_strength).has_state()) {
        return (
          std::string("{\"distance\": ") + to_string(id(distance).state) +
          std::string(", \"signal\": ") + to_string(id(signal_strength).state) +
          std::string("}")
        );
      } else {
        return std::string("{\"status\": \"booting\"}");
      }    


wifi:
  reboot_timeout: 15min
  output_power: 15dB
  power_save_mode: none
  ap:
  manual_ip:
    static_ip: 192.168.7.218
    gateway: 192.168.7.1
    subnet: 255.255.255.0
    dns1: 31.30.90.11

captive_portal:

improv_serial:

logger:
  level: DEBUG
  logs:
    sensor: WARN
    text_sensor: WARN

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  include_internal: false
  version: 3

packages:
  wifi: !include packages/common/wifi.yaml
  uptime: !include packages/common/uptime.yaml
  debug: !include packages/common/debug.yaml
